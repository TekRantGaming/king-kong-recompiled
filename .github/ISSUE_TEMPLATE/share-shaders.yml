name: Share shaders
description: Attach the shader file the launcher made for you (Play page, Share my shaders) to help build the shader pack.
title: "Shaders from my play-through"
labels: ["shaders"]
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for helping your fellow players!**

        Every shader you share goes into a future shader pack, so the next players get a smoother first
        play-through. The file holds only shader data (the effects the game prepared while you played):
        nothing personal, no saves or settings.

        Not sure where the file is? In the launcher, open the **Play** page and click **Share my shaders**.
        It saves a `shader-share-....zip` file in your `Documents\king_kong` folder and shows it to you.
  - type: textarea
    id: file
    attributes:
      label: Your shader file
      description: Drag the shader-share-....zip file into this box. Wait until it has finished uploading before you submit.
      placeholder: Drop the .zip file here
    validations:
      required: true
  - type: dropdown
    id: progress
    attributes:
      label: How far did you play?
      options:
        - The first few chapters
        - About half the game
        - Most of the game
        - The whole game
    validations:
      required: false
  - type: input
    id: gpu
    attributes:
      label: Graphics card (optional)
      description: Helps us cover every type of card. NVIDIA, AMD and Intel cards use slightly different shader lists.
      placeholder: e.g. RTX 4070, RX 7800 XT, Arc A770
    validations:
      required: false
